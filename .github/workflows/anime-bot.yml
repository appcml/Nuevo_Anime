name: Bot Anime V3

on:
  schedule:
    - cron: '0 */2 * * *'  # Ejecutar cada 2 horas
  workflow_dispatch:  # Permite ejecución manual

jobs:
  publicar:
    name: Publicar en Facebook
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pillow
          pip install google-genai || echo "⚠️ google-genai no disponible"
      
      - name: Verificar archivo del bot
        run: |
          echo "📁 Archivos Python:"
          ls -la *.py
          if [ -f "bot_anime_v3.py" ]; then
            echo "✅ Archivo 'bot_anime_v3.py' encontrado"
          else
            echo "❌ Archivo no encontrado"
            exit 1
          fi
      
      - name: Ejecutar Bot Anime V3
        run: python bot_anime_v3.py  # ← SIN comillas, nombre correcto
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
