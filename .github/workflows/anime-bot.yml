name: 🤖 Bot de Noticias Anime

on:
  schedule:
    # Ejecutar cada 60 minutos
    - cron: '0 * * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub

env:
  PYTHONUNBUFFERED: 1

jobs:
  publicar-anime:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout del repositorio
      uses: actions/checkout@v4
      
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install google-generativeai  # Para Gemini AI
    
    - name: 🚀 Ejecutar Bot de Anime
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        HISTORIAL_PATH: data/historial_anime.json
        ESTADO_PATH: data/estado_bot_anime.json
      run: python bot_anime.py
    
    - name: 💾 Guardar historial actualizado
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "🤖 Actualizar historial de publicaciones - $(date +'%Y-%m-%d %H:%M')"
        git push || echo "No hay cambios para guardar"
