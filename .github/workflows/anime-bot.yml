name: Bot de Noticias Anime

on:
  schedule:
    # Ejecutar cada 90 minutos (16 publicaciones diarias aprox)
    - cron: '0 */1 * * *'  # Cada hora (ajustable)
    - cron: '30 */1 * * *' # Cada hora y media
  
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Crear carpeta data
        run: mkdir -p data
      
      - name: Ejecutar bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          HISTORIAL_PATH: data/historial_anime.json
          ESTADO_PATH: data/estado_bot_anime.json
        run: python bot_anime.py
      
      - name: Guardar estado entre ejecuciones
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-data
          path: data/
          retention-days: 7
      
      - name: Restaurar estado anterior
        uses: actions/download-artifact@v4
        with:
          name: bot-data
          path: data/
        continue-on-error: true
